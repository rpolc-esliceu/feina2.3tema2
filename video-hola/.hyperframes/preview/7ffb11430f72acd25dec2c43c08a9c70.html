<style>/* Estil de la casa: paper pautat, traç negre, lletra de mà. No cal tocar-lo. */
* {
  margin: 0;
}

:root {
  --tinta: #1d1c1a;
  --gris: #6f6a61;
  --ratlla: #dcd7cd;
  --paper: #fbfaf7;
  --blau: #1750a1;
  --taronja: #9a3b12;
}

html,
body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: var(--paper);
}

/* Full pautat, com el llibre */
.paper {
  position: relative;
  width: 1920px;
  height: 1080px;
  background-color: var(--paper);
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 53px,
    var(--ratlla) 53px,
    var(--ratlla) 55px
  );
  font-family: "Lato L", sans-serif;
  color: var(--tinta);
}

.bit,
.globus,
.titol,
.subratllat,
.nota {
  position: absolute;
}

.titol {
  font-weight: 700;
  font-size: 100px;
}

.subratllat {
  height: 10px;
  background: var(--tinta);
  border-radius: 6px;
  transform-origin: left center;
}

.nota {
  font-family: "Caveat L", cursive;
  font-size: 80px;
  color: var(--blau);
  transform: rotate(-3deg);
}

/* El globus d'en Bit */
.globus {
  padding: 30px 80px 50px;
  background: #ffffff;
  border: 6px solid var(--tinta);
  border-radius: 48px 70px 56px 64px / 60px 44px 70px 50px;
  font-family: "Caveat L", cursive;
  font-size: 190px;
  line-height: 1;
}

.globus::after {
  content: "";
  position: absolute;
  left: -34px;
  bottom: 40px;
  width: 50px;
  height: 50px;
  background: #ffffff;
  border-left: 6px solid var(--tinta);
  border-bottom: 6px solid var(--tinta);
  transform: skewX(-20deg) rotate(30deg);
}

/* Una fitxa de dades */
.fitxa {
  width: 460px;
  height: 320px;
  box-sizing: border-box;
  padding: 36px 40px;
  background: #ffffff;
  border: 6px solid var(--tinta);
  border-radius: 20px 28px 22px 26px / 26px 20px 28px 22px;
}

.fitxa .nom {
  font-weight: 700;
  font-size: 84px;
}

.fitxa .ciutat,
.fitxa .detall {
  font-family: "PT Serif L", serif;
  font-size: 48px;
  color: var(--gris);
}

.fitxa .saldo,
.fitxa .xifra {
  margin-top: 12px;
  font-family: "PT Mono L", monospace;
  font-size: 72px;
}

.fitxa .deutor {
  color: var(--taronja);
}

#bit {
left: 200px;
top: 360px;
width: 300px;
}

left: 600px;
top: 190px;
}

}

}</style>
